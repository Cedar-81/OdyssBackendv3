<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Clerk Test</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 600px; margin: 0 auto; padding: 20px; }
        .log { background: #f5f5f5; padding: 10px; margin: 10px 0; border-radius: 5px; }
        .error { background: #ffe6e6; color: #d32f2f; }
        .success { background: #e8f5e8; color: #2e7d32; }
        button { margin: 5px; padding: 10px 15px; cursor: pointer; }
    </style>
</head>
<body>
    <h1>🔐 Simple Clerk Test</h1>
    
    <div>
        <button onclick="testDirectSignIn()">Test Direct Sign In</button>
        <button onclick="clearLogs()">Clear Logs</button>
    </div>
    
    <div id="logs"></div>

    <script>
        const API_BASE_URL = 'http://localhost:3000/api';

        function log(message, type = 'info') {
            const logsDiv = document.getElementById('logs');
            const logDiv = document.createElement('div');
            logDiv.className = `log ${type}`;
            logDiv.innerHTML = `<strong>${new Date().toLocaleTimeString()}:</strong> ${message}`;
            logsDiv.appendChild(logDiv);
            console.log(message);
        }

        function clearLogs() {
            document.getElementById('logs').innerHTML = '';
        }

        async function testDirectSignIn() {
            try {
                log('Testing direct sign in approach...');
                
                // Get the Clerk key from our server
                const configResponse = await fetch(`${API_BASE_URL}/config`);
                const config = await configResponse.json();
                const clerkKey = config.clerkPublishableKey;
                
                if (!clerkKey) {
                    log('❌ No Clerk key found', 'error');
                    return;
                }
                
                log(`✅ Got Clerk key: ${clerkKey.substring(0, 20)}...`, 'success');
                
                // Create a simple sign-in URL
                const signInUrl = `https://accounts.clerk.com/sign-in?redirect_url=${encodeURIComponent(window.location.href)}`;
                
                log('Opening Clerk sign-in page...', 'info');
                window.open(signInUrl, '_blank', 'width=500,height=600');
                
                log('✅ Opened Clerk sign-in in new window', 'success');
                log('After signing in, you can test the API endpoints with a valid token', 'info');
                
            } catch (error) {
                log(`❌ Error: ${error.message}`, 'error');
            }
        }

        // Auto-test on load
        window.addEventListener('load', () => {
            log('Page loaded. Click "Test Direct Sign In" to open Clerk sign-in.', 'info');
        });
    </script>
</body>
</html>
